    description: "Indicates normal page table to paging hardware."
    models: [nd100]
  - token: "MIS,APT"
    category: MIS
    display_line: 2
    encoding: { w4: "000000", w3: "004000", w2: "000000", w1: "000000" }
    description: "Indicates alternative page table to paging hardware."
    models: [nd100]
  - token: "MIS,HOLD"
    category: MIS
    display_line: 2
    encoding: { w4: "000000", w3: "006000", w2: "000000", w1: "000000" }
    description: "Indicates 'last used page table' to paging hardware."
    models: [nd100]

  # Role B: Shift mode when ALUM = MIC.
  - token: "MIS,ROT"
    category: MIS
    display_line: 1
    encoding: { w4: "000000", w3: "002000", w2: "000000", w1: "000000" }
    description: "Specifies rotational shift if ALUM,MIC."
    models: [nd100]
  - token: "MIS,ZIN"
    category: MIS
    display_line: 1
    encoding: { w4: "000000", w3: "004000", w2: "000000", w1: "000000" }
    description: "Specifies zero-end-input shift if ALUM,MIC."
    models: [nd100]
  - token: "MIS,LIN"
    category: MIS
    display_line: 1
    encoding: { w4: "000000", w3: "006000", w2: "000000", w1: "000000" }
    description: "Specifies link-end-input shift if ALUM,MIC. (Manual calls this 'LIR'; assembler uses 'LIN'.)"
    models: [nd100]
    alias_on_manual: "LIR"

  # ==================================================================
  # CYCL (TC / cycle timing) - bits 20-21 = w2 bits 4-5
  # ==================================================================
  - token: "CYCL,FAST"
    category: SPECIAL
    display_line: 2
    encoding: { w4: "000000", w3: "000000", w2: "000000", w1: "000000" }
    description: "Fast microcycle (~150 ns). Only available on ND-100 with the fast-option hardware."
    models: [nd100]
  - token: "CYCL,NORM"
    category: SPECIAL
    display_line: 2
    encoding: { w4: "000000", w3: "000000", w2: "000020", w1: "000000" }
    description: "Normal microcycle (~170 ns). Not used on standard ND-100."
    models: [nd100]
  - token: "CYCL,SLOW"
    category: SPECIAL
    display_line: 2
    encoding: { w4: "000000", w3: "000000", w2: "000040", w1: "000000" }
    description: "Slow microcycle (~190 ns). Default on standard ND-100."
    models: [nd100]
  - token: "CYCL,WAIT"
    category: SPECIAL
    display_line: 2
    encoding: { w4: "000000", w3: "000000", w2: "000060", w1: "000000" }
    description: "Wait for bus-control synchronization."
    models: [nd100]

  # ==================================================================
  # CONTROL-BIT TOKENS
  # ==================================================================
  - token: "LCOUNT"
    category: SPECIAL
    display_line: 2
    encoding: { w4: "000000", w3: "000000", w2: "000100", w1: "000000" }
    description: "Count loop-counter; if false 'RETURN'&'HOLD'; if true use true specifications."
    models: [nd100]
  - token: "CONDENABL"
    category: SPECIAL
    display_line: 3
    encoding: { w4: "000000", w3: "000000", w2: "000200", w1: "000000" }
    description: "Enable conditional sequencing; use FALSE specs if condition is false."
    models: [nd100]
  - token: "SLWCS"
    category: SPECIAL
    display_line: 2
    encoding: { w4: "000000", w3: "000000", w2: "002000", w1: "000000" }
    description: "Start Load Writable Control Store. Avoid 'ROM-OUT-OF-RANGE'."
    models: [nd100]

  # ==================================================================
  # IDBS (INTERNAL DATA BUS SOURCE) - bits 37-40 = w3 bits 5-8
  # Plus SEXT modifier at bit 41 = w3 bit 9.
  # ==================================================================
  - token: "IDBS,ALU"
    category: IDBS
    display_line: 2
    encoding: { w4: "000000", w3: "000000", w2: "000000", w1: "000000" }
    description: "Arithmetic-Logic-Unit -> IDB."
    models: [nd100]
  - token: "IDBS,BMG"
    category: IDBS
    display_line: 2
    encoding: { w4: "000000", w3: "000040", w2: "000000", w1: "000000" }
    description: "Bit-Mask-Generator -> IDB."
    models: [nd100]
  - token: "IDBS,GPR"
    category: IDBS
    display_line: 2
    encoding: { w4: "000000", w3: "000100", w2: "000000", w1: "000000" }
    description: "General-Purpose-Register -> IDB."
    models: [nd100]
  - token: "IDBS,DBR"
    category: IDBS
    display_line: 2
    encoding: { w4: "000000", w3: "000140", w2: "000000", w1: "000000" }
    description: "Data-Bus-Register -> IDB (requires WAIT cycle)."
    models: [nd100]
  - token: "IDBS,ARG"
    category: IDBS
    display_line: 2
    encoding: { w4: "000000", w3: "000200", w2: "000000", w1: "000000" }
    description: "Argument (microinstruction bits 0-15) -> IDB."
    models: [nd100]
  - token: "IDBS,REG"
    category: IDBS
    display_line: 2
    encoding: { w4: "000000", w3: "000240", w2: "000000", w1: "000000" }
    description: "Register file word at (AOP, BOP) -> IDB."
    models: [nd100]
  - token: "IDBS,STS"
    category: IDBS
    display_line: 2
    encoding: { w4: "000000", w3: "000300", w2: "000000", w1: "000000" }
    description: "16-bit STATUS register -> IDB."
    models: [nd100]
  - token: "IDBS,MMR"
    category: IDBS
    display_line: 2
    encoding: { w4: "000000", w3: "000340", w2: "000000", w1: "000000" }
    description: "Memory-Management Read register -> IDB (register selected by prior LDIRNO)."
    models: [nd100]
  - token: "IDBS,BARG"
    category: IDBS
    display_line: 2
    encoding: { w4: "000000", w3: "000400", w2: "000000", w1: "000000" }
    description: "B-operand as argument (0-17 octal) -> IDB."
    models: [nd100]
  - token: "IDBS,SWAP"
    category: IDBS
    display_line: 2
    encoding: { w4: "000000", w3: "000440", w2: "000000", w1: "000000" }
    description: "Byte-swap of last IDB -> IDB (two bytes exchanged)."
    models: [nd100]
  - token: "IDBS,PEA"
    category: IDBS
    display_line: 2
    encoding: { w4: "000000", w3: "000500", w2: "000000", w1: "000000" }
    description: "PEA (Page-Enable-A) register -> IDB (inverted)."
    models: [nd100]
  - token: "IDBS,PES"
    category: IDBS
    display_line: 2
    encoding: { w4: "000000", w3: "000540", w2: "000000", w1: "000000" }
    description: "PES (Page-Enable-S) register -> IDB (inverted)."
    models: [nd100]
  - token: "IDBS,AARG"
    category: IDBS
    display_line: 2
    encoding: { w4: "000000", w3: "000600", w2: "000000", w1: "000000" }
    description: "A-operand as argument * 10 (shifted left 3) -> IDB (0-170 octal)."
    models: [nd100]
  - token: "IDBS,PIC"
    category: IDBS
    display_line: 2
    encoding: { w4: "000000", w3: "000640", w2: "000000", w1: "000000" }
    description: "PIC (Priority-Interrupt-Control) status register bus -> IDB. Must issue RSTS command to PIC simultaneously."
    models: [nd100]
  - token: "IDBS,IOR"
    category: IDBS
    display_line: 2
    encoding: { w4: "000000", w3: "000700", w2: "000000", w1: "000000" }
    description: "UART data and status -> IDB."
    models: [nd100]
  - token: "IDBS,DSABL"
    category: IDBS
    display_line: 2
    encoding: { w4: "000000", w3: "000740", w2: "000000", w1: "000000" }
    description: "Disable sources to IDB (used to read PIC-info except PIC status)."
    models: [nd100]
  - token: "IDBS,GPR,SEXT"
    category: IDBS
    display_line: 2
    encoding: { w4: "000000", w3: "001100", w2: "000000", w1: "000000" }
    description: "GPR bits 0-7 (with bits 8-15 equal to bit 7) -> IDB. Sign-extension via SEXT bit 41."
    models: [nd100]

  - token: "SEXT"
    category: SPECIAL
    display_line: 2
    encoding: { w4: "000000", w3: "001000", w2: "000000", w1: "000000" }
    description: "Standalone sign-extend modifier (bit 41). Normally combined with IDBS,GPR as the IDBS,GPR,SEXT composite; appears standalone on ND-100 microwords that use SEXT with a non-GPR IDBS source or with IDBS disabled."
    models: [nd100]

  - token: "EN_EXT"
    category: SPECIAL
    display_line: 1
    encoding: { w4: "000004", w3: "000000", w2: "000000", w1: "000000" }
    description: "Standalone XRF / Enable Extended Register File (bit 50). Normally bit 50 is embedded in composite A_REG tokens such as A,SRCE; this token exists for microwords where bit 50 is asserted but no composite A-operand token matches."
    models: [nd100]

  # The printed ND-100 microcode listing (CX option, PROM 085XX; ND100-MICROCODE.pdf) spells bit 50
  # XRF, 145 times, for example "IDBS,ALU XRF COMM,EWRF T,NEXT". It is not in ND-06.018.01 Appendix A.
  # Same bit as EN_EXT; the disassembler keeps writing EN_EXT (the first name in this file).
  - token: "XRF"
    category: SPECIAL
    display_line: 2
    encoding: { w4: "000004", w3: "000000", w2: "000000", w1: "000000" }
    description: "Enable the extended register file (bit 50). The name used in the printed ND-100 microcode listing; the same bit as EN_EXT."
    models: [nd100]

  # ==================================================================
  # COMM (COMMAND) - bits 32-36 = w3 bits 0-4
  # ==================================================================
  # OCR CORRECTIONS: the user's source list had 22 COMM rows
  # (ESRP..IOX, LDIR, XMM, IRDRQ, DERQ, EXRQ) with the encoding in
  # the w2 column; the correct column is w3, per architecture and
  # confirmed via rows 212/213. All COMM values below are in w3.

  - token: "COMM,ESRP"
    category: COMM
    display_line: 2
    encoding: { w4: "000000", w3: "000010", w2: "000000", w1: "000000" }
    description: "Set 'R=P' flip-flop if 'F=0' is true. Detects store into prefetched next location."
    models: [nd100]
  - token: "COMM,EPIC"
    category: COMM
    display_line: 2
    encoding: { w4: "000000", w3: "000011", w2: "000000", w1: "000000" }
    description: "A-operand is an instruction to PIC (Priority Interrupt Controller)."
    models: [nd100]
  - token: "COMM,SMPID"
    category: COMM
    display_line: 2
    encoding: { w4: "000000", w3: "000012", w2: "000000", w1: "000000" }
    description: "Set Micro-PID. PID positions where IDB has 1 are forced high (can only set, not clear)."
    models: [nd100]
  - token: "COMM,START"
    category: COMM
    display_line: 2
    encoding: { w4: "000000", w3: "000013", w2: "000000", w1: "000000" }
    description: "Reset the STOP flip-flop."
    models: [nd100]
  - token: "COMM,SSTOP"
    category: COMM
    display_line: 2
    encoding: { w4: "000000", w3: "000014", w2: "000000", w1: "000000" }
    description: "Set the STOP flip-flop."
    models: [nd100]
  - token: "COMM,CLRTC"
    category: COMM
    display_line: 2
    encoding: { w4: "000000", w3: "000015", w2: "000000", w1: "000000" }
    description: "Clear the 20ms clock flip-flop."
    models: [nd100]
  - token: "COMM,CLFF"
    category: COMM
    display_line: 2
    encoding: { w4: "000000", w3: "000016", w2: "000000", w1: "000000" }
    description: "Clear the OOD and the DZD flip-flops (floating-point rounding indicators)."
    models: [nd100]
  - token: "COMM,LDLC"
    category: COMM
    display_line: 2
    encoding: { w4: "000000", w3: "000017", w2: "000000", w1: "000000" }
    description: "Load the Loop Counter with the 6 lower IDB bits."
    models: [nd100]
  - token: "COMM,LDPIL"
    category: COMM
    display_line: 2
    encoding: { w4: "000000", w3: "000001", w2: "000000", w1: "000000" }
    description: "IDB bits 8-15 -> STATUS bits 8-15."
    models: [nd100]
  - token: "COMM,LDGPR"
    category: COMM
    display_line: 2
    encoding: { w4: "000000", w3: "000002", w2: "000000", w1: "000000" }
    description: "IDB -> General-Purpose Register."
    models: [nd100]
  - token: "COMM,EWRF"
    category: COMM
    display_line: 2
    encoding: { w4: "000000", w3: "000003", w2: "000000", w1: "000000" }
    description: "IDB -> register file word addressed by A-operand and B-operand."
    models: [nd100]
  - token: "COMM,CLIRQ"
    category: COMM
    display_line: 2
    encoding: { w4: "000000", w3: "000004", w2: "000000", w1: "000000" }
    description: "Prevent jump to the interrupt vector; remove PANEL effect on IRQ test."
    models: [nd100]
  - token: "COMM,RSDA"
    category: COMM
    display_line: 2
    encoding: { w4: "000000", w3: "000005", w2: "000000", w1: "000000" }
    description: "Reset Data Available in UART."
    models: [nd100]
  - token: "COMM,TBSTR"
    category: COMM
    display_line: 2
    encoding: { w4: "000000", w3: "000006", w2: "000000", w1: "000000" }
    description: "Transmit Buffer Strobe to UART. Lower IDB bits loaded into UART."
    models: [nd100]
  - token: "COMM,SIOC"
    category: COMM
    display_line: 2
    encoding: { w4: "000000", w3: "000007", w2: "000000", w1: "000000" }
    description: "Load I/O-Control register, controlling terminal 1 and clock interrupts etc."
    models: [nd100]
  - token: "COMM,RDRQ"
    category: COMM
    display_line: 2
    encoding: { w4: "000000", w3: "000034", w2: "000000", w1: "000000" }
    description: "Read memory request; address present on IDB."
    models: [nd100]
  - token: "COMM,WRRQ"
    category: COMM
    display_line: 2
    encoding: { w4: "000000", w3: "000035", w2: "000000", w1: "000000" }
    description: "Write memory request; address present on IDB."
    models: [nd100]
  - token: "COMM,IDENT"
    category: COMM
    display_line: 2
    encoding: { w4: "000000", w3: "000036", w2: "000000", w1: "000000" }
    description: "Start IDENT cycle on bus; address present on IDB."
    models: [nd100]
  - token: "COMM,IOX"
    category: COMM
    display_line: 2
    encoding: { w4: "000000", w3: "000037", w2: "000000", w1: "000000" }
    description: "Start IOX cycle on bus; address present on bus."
    models: [nd100]
  - token: "COMM,IRDRQ"
    category: COMM
    display_line: 2
    encoding: { w4: "000000", w3: "000030", w2: "000000", w1: "000000" }
    description: "Indirect address memory request; address on IDB. MIS selects paging mode."
    models: [nd100]
  - token: "COMM,DERQ"
    category: COMM
    display_line: 2
    encoding: { w4: "000000", w3: "000031", w2: "000000", w1: "000000" }
    description: "Deposit memory request; address present on IDB."
    models: [nd100]
  - token: "COMM,EXRQ"
    category: COMM
    display_line: 2
    encoding: { w4: "000000", w3: "000030", w2: "000000", w1: "000000" }
    description: "Examine memory request; address present on IDB. Same COMM code as IRDRQ with MIS=FETCH."
    models: [nd100]
    alias_of: "COMM,IRDRQ"
  - token: "COMM,LDIR"
    category: COMM
    display_line: 2
    encoding: { w4: "000000", w3: "000020", w2: "000000", w1: "000000" }
    description: "Load Interrupt Register Number into MMM (selects MMM register for subsequent access)."
    models: [nd100]
  - token: "COMM,XMM"
    category: COMM
    display_line: 2
    encoding: { w4: "000000", w3: "000021", w2: "000000", w1: "000000" }
    description: "Read/Write MMM register (previously selected by COMM,LDIR)."
    models: [nd100]

  # ==================================================================
  # T-SEQUENCE (bits 30-31) + MAPJ (bit 27) vectored-jump variants
  # ==================================================================
  - token: "T,JMP"
    category: T_SEQ
    display_line: 2
    encoding: { w4: "000000", w3: "000000", w2: "000000", w1: "000000" }
    description: "True sequence is JMP."
    models: [nd100]
  - token: "T,JMP0-3"
    category: T_SEQ
    display_line: 2
    encoding: { w4: "000000", w3: "000000", w2: "001000", w1: "000000" }
    description: "True sequence is JMP. IR bits 0-3 control the four lower jump-address bits."
    models: [nd100]
  - token: "T,JMP8-10"
    category: T_SEQ
    display_line: 2
    encoding: { w4: "000000", w3: "002000", w2: "001000", w1: "000000" }
    description: "True sequence is JMP. IR bits 8-10 control the 3 lower jump-address bits."
    models: [nd100]
  - token: "T,JMPALD"
    category: T_SEQ
    display_line: 2
    encoding: { w4: "000000", w3: "004000", w2: "001000", w1: "000000" }
    description: "True sequence is JMP. ALD controls the 4 lower jump-address bits."
    models: [nd100]
  - token: "T,JMPAOPR"
    category: T_SEQ
    display_line: 2
    encoding: { w4: "000000", w3: "006000", w2: "001000", w1: "000000" }
    description: "True sequence is JMP. A-operand controls the 4 lower jump-address bits."
    models: [nd100]
  - token: "T,MAPJ"
    category: T_SEQ
    display_line: 2
    encoding: { w4: "000000", w3: "000000", w2: "004000", w1: "000000" }
    description: "If next microinstruction is JMP, the JMP will be mapped by the mapping hardware (bit 27 = MAPJ active)."
    models: [nd100]
  - token: "T,RETURN"
    category: T_SEQ
    display_line: 2
    encoding: { w4: "000000", w3: "000000", w2: "040000", w1: "000000" }
    description: "True sequence is RETURN."
    models: [nd100]
  - token: "T,NEXT"
    category: T_SEQ
    display_line: 2
    encoding: { w4: "000000", w3: "000000", w2: "100000", w1: "000000" }
    description: "True sequence is NEXT."
    models: [nd100]

  - token: "T,REPEAT"
    category: T_SEQ
    display_line: 2
    encoding: { w4: "000000", w3: "000000", w2: "140000", w1: "000000" }
    description: "True sequence is REPEAT (T_SEQ=0b11). Repeats the current microinstruction - used by multi-cycle operations."
    models: [nd100]

  # T-STACK (bits 28-29)
  - token: "T,HOLD"
    category: T_STK
    display_line: 2
    encoding: { w4: "000000", w3: "000000", w2: "000000", w1: "000000" }
    description: "True stack operation is HOLD."
    models: [nd100]
  - token: "T,POP"
    category: T_STK
    display_line: 2
    encoding: { w4: "000000", w3: "000000", w2: "010000", w1: "000000" }
    description: "True stack operation is POP."
    models: [nd100]
  - token: "T,LOAD"
    category: T_STK
    display_line: 2
    encoding: { w4: "000000", w3: "000000", w2: "020000", w1: "000000" }
    description: "True stack operation is LOAD."
    models: [nd100]
  - token: "T,PUSH"
    category: T_STK
    display_line: 2
    encoding: { w4: "000000", w3: "000000", w2: "030000", w1: "000000" }
    description: "True stack operation is PUSH."
    models: [nd100]

  # F-SEQUENCE (bits 2-3) + F-STACK (bits 0-1), only active when SCOND set.
  - token: "F,JMP"
    category: F_SEQ
    display_line: 3
    encoding: { w4: "000000", w3: "000000", w2: "000000", w1: "000000" }
    description: "False sequence is JMP. Used with a condition setting (COND,...)."
    models: [nd100]
  - token: "F,RETURN"
    category: F_SEQ
    display_line: 3
    encoding: { w4: "000000", w3: "000000", w2: "000000", w1: "000004" }
    description: "False sequence is RETURN. Used with a condition setting."
    models: [nd100]
  - token: "F,NEXT"
    category: F_SEQ
    display_line: 3
    encoding: { w4: "000000", w3: "000000", w2: "000000", w1: "000010" }
    description: "False sequence is NEXT. Used with a condition setting."
    models: [nd100]
  - token: "F,HOLD"
    category: F_STK
    display_line: 3
    encoding: { w4: "000000", w3: "000000", w2: "000000", w1: "000000" }
    description: "False stack operation is HOLD. Used with a condition setting."
    models: [nd100]
  - token: "F,POP"
    category: F_STK
    display_line: 3
    encoding: { w4: "000000", w3: "000000", w2: "000000", w1: "000001" }
    description: "False stack operation is POP. Used with a condition setting."
    models: [nd100]
  - token: "F,LOAD"
    category: F_STK
    display_line: 3
    encoding: { w4: "000000", w3: "000000", w2: "000000", w1: "000002" }
    description: "False stack operation is LOAD. Used with a condition setting."
    models: [nd100]
  - token: "F,PUSH"
    category: F_STK
    display_line: 3
    encoding: { w4: "000000", w3: "000000", w2: "000000", w1: "000003" }
    description: "False stack operation is PUSH. Used with a condition setting."
    models: [nd100]

  # ==================================================================
  # COND (CONDITION TEST) - bits 4-7 = TSEL, SCOND (bit 24) set
  # ==================================================================
  - token: "COND,STP"
    category: COND
    display_line: 3
    encoding: { w4: "000000", w3: "000000", w2: "000400", w1: "000360" }
    description: "Condition for testing is STOP (STP flip-flop)."
    provides: COND
    models: [nd100]
  - token: "COND,OPCTT1"
    category: COND
    display_line: 3
    encoding: { w4: "000000", w3: "000000", w2: "000400", w1: "000220" }
    description: "Condition for testing is whether TT1 is on CPU board (MOPC terminal test for devices 0o300..0o307)."
    provides: COND
    models: [nd100]
  - token: "COND,OVF"
    category: COND
    display_line: 3
    encoding: { w4: "000000", w3: "000000", w2: "000400", w1: "000240" }
    description: "Condition for testing is 'Overflow' from ALU bit-slices."
    provides: COND
    models: [nd100]
  - token: "COND,CRY"
    category: COND
    display_line: 3
    encoding: { w4: "000000", w3: "000000", w2: "000400", w1: "000260" }
    description: "Condition for testing is 'Carry' from ALU bit-slices."
    provides: COND
    models: [nd100]
  - token: "COND,F11"
    category: COND
    display_line: 3
    encoding: { w4: "000000", w3: "000000", w2: "000400", w1: "000300" }
    description: "Condition for testing is bit 11 from ALU bit-slices."
    provides: COND
    models: [nd100]
  - token: "COND,F15"
    category: COND
    display_line: 3
    encoding: { w4: "000000", w3: "000000", w2: "000400", w1: "000320" }
    description: "Condition for testing is bit 15 (sign bit) from ALU bit-slices."
    provides: COND
    models: [nd100]
  - token: "COND,F=0"
    category: COND
    display_line: 3
    encoding: { w4: "000000", w3: "000000", w2: "000400", w1: "000340" }
    description: "Condition for testing is 'All zeros' from ALU bit-slices."
    provides: COND
    models: [nd100]
  - token: "COND,DR=2"

# ND-100 Microcode Tokens
#
# Source: user-provided authoritative ND-100 assembler mnemonic list
# (296 tokens, 2026-04-16), cross-referenced against the NORD-100
# Microprogramming Description manual (ND-06.018.01).
#
# Token encoding convention (same as ND-110/120 YAML):
#   w1 = bits 15:0,  w2 = bits 31:16,  w3 = bits 47:32,  w4 = bits 63:48.
# ND-100 only uses bits 0-47; w4 is retained for format compatibility
# (always 000000 except for ALUI tokens, which live at bits 55-63).
#
# OCR CORRECTIONS applied to the source list:
#   - Row 212 (COMM,LDPIL): OCR had (1,0,0,0); correct is (0,1,0,0).
#   - Rows 204-211 and 214-227 (22 COMM tokens): OCR had the encoding
#     value in the w2 column (Col3); correct is w3 (Col2). Every COMM
#     on ND-100 places its 5-bit code at bits 32-36 (= w3 bits 0-4),
#     matching the manual (page 21) and matching the ND-110 layout.
#     User confirmed this via rows 212/213.
#
# Models:
#   Every token here is present on ND-100. Tokens flagged
#   `alias_on_nd110` or `alias_on_nd120` note cross-model equivalents
#   where the name differs but the function is identical.

model: ND-100
word_size_bits: 48
byte_count: 6
byte_order: little-endian
token_count: 300

tokens:

  # ==================================================================
  # A-OPERAND REGISTER TOKENS (bits 12-15 = w1 bits 12-15)
  # ==================================================================
  # AOP value N encoded as w1 = N << 12 (octal: value * 0o10000).

  - token: "A,Z"
    category: A_REG
    display_line: 1
    encoding: { w4: "000000", w3: "000000", w2: "000000", w1: "000000" }
    description: "A-OP. IS 0. USED TO ADDR. ZERO REG., STATUS OR SCRATCH"
